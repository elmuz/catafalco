  - account
  - advanced_search
  - calendar
  - contacts
  - core
  - desktop_notifications
  - feeds
  - gmail_contacts
  - history
  - idle_timer
  - imap
  - imap_folders
  - jmap
  - keyboard_shortcuts
  - local_contacts
  - nux
  - profiles
  - sievefilters
  - smtp
  - tags
  - themes
