---
cypht_container_name: cypht
cypht_network_name: cypht_network
cypht_subdomain: mail
cypht_dashboard_url: https://{{ cypht_subdomain }}.{{ site_url }}
cypht_dashboard_name: "Cypht"
cypht_homer:
  name: "{{ cypht_dashboard_name }}"
  category: services

cypht_modules:
