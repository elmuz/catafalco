---
docker_dir: /srv
docker_install_nvidia_runtime: auto
docker_volumes_backup: "{{ (mergerfs_root | default('/srv')) ~ '/docker-volumes-backup' }}"
docker_restore_volumes_backup: false
docker_address_pools:
  - base: "172.32.0.0/16" # 256 networks of 256-2=254 peers
    size: 24
  - base: "172.33.0.0/16"
    size: 24
