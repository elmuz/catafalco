---
- name: Install SnapRAID
  ansible.builtin.include_tasks:
    file: install_snapraid.yml

- name: Install Snapper
  ansible.builtin.include_role:
    name: snapper

- name: Snapraid-btrfs install
  ansible.builtin.include_tasks:
    file: install_snapraid-btrfs.yml

- name: SnapRAID base config
  ansible.builtin.include_tasks:
    file: configure_snapraid.yml

# One-off cleanup of the ACL grant this role used before the sudoers rule.
# Safe to remove together with the switch in defaults/main.yml.
- name: Revoke legacy SnapRAID ACLs
  ansible.builtin.include_tasks:
    file: cleanup_legacy_acl.yml
  when: snapraid_cleanup_legacy_acl | bool

- name: Configure snapraid-btrfs-runner
  ansible.builtin.include_tasks:
    file: configure_snapraid-btrfs-runner.yml
