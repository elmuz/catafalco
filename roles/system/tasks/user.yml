---
- name: Ensure exists group "{{ username }}"
  ansible.builtin.group:
    name: "{{ username }}"
    state: present

- name: Create a login user
  ansible.builtin.user:
    name: "{{ username }}"
    password: "{{ password | password_hash('sha512') }}"
    create_home: true
    shell: "{{ shell | default('/bin/bash') }}"
    group: "{{ username }}"
    groups:
      - "{{ system_sudo_group }}"
    append: true
    state: present

# Do not grant blanket passwordless sudo. The admin user stays in the sudo
# group and gets the distribution's normal passworded rule; automation gets
# scoped entries under /etc/sudoers.d (telegraf SMART, snapraid status).
# These removal tasks also converge hosts provisioned by older revisions,
# where the two NOPASSWD lines were written into /etc/sudoers.
- name: Remove passwordless sudo for the sudo group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: absent
    regexp: '^%\s*{{ system_sudo_group }}\s+ALL=\(ALL(:ALL)?\)\s+NOPASSWD:\s*ALL\s*$'
    validate: /usr/sbin/visudo -cf %s

- name: Remove passwordless sudo for the admin user
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: absent
    regexp: '^{{ username | regex_escape }}\s+ALL=\(ALL(:ALL)?\)\s+NOPASSWD:\s*ALL\s*$'
    validate: /usr/sbin/visudo -cf %s

- name: Copy the public SSH key
  ansible.posix.authorized_key:
    user: "{{ username }}"
    state: present
    key: "{{ lookup('file', ssh_public_key) }}"

###### Samba: create group and add additional users ######
- name: Ensure group "sambashare" exists
  when: enable_samba | default(false)
  block:
    - name: Ensure group "sambashare" exists
      ansible.builtin.group:
        name: sambashare
        state: present

    - name: Append the samba group to the default user
      ansible.builtin.user:
        name: "{{ username }}"
        groups:
          - sambashare
        append: true

    - name: Create additional users (no login)
      when: samba_users is defined
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        password: "{{ item.password | password_hash('sha512') }}"
        update_password: on_create
        state: present
        append: true
        shell: /sbin/nologin
      loop: "{{ samba_users }}"
      no_log: true
