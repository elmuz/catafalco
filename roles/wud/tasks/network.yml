---
- name: Create a docker network
  community.docker.docker_network:
    name: "{{ wud_network_name }}"
    connected:
      - "{{ wud_network_container }}"
    appends: true
  loop:
    - "{{ swag_container_name }}"
    - "{{ socket_proxy_container_name }}"
  loop_control:
    loop_var: wud_network_container
