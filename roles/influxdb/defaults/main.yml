---
influxdb_container_name: influxdb
influxdb_network_name: "{{ monitoring_network }}"

# Images. `3-core` and `latest` are floating tags: every role run pulls them
# (`pull: true`), so an unattended upgrade can change the on-disk format or the
# flag/env contract under us. Pin both to a released tag once that version has
# been verified, and bump deliberately.
influxdb_image: influxdb:3-core
influxdb_ui_image: influxdata/influxdb3-ui

# Persistence layout. The container's *root* directory is mounted, not its data
# directory: whatever path InfluxDB decides to use (the data-dir variable, a
# default, or a future renamed variable) then lands inside the bind mount
# instead of the container's writable layer (T-21): a store in the writable layer
# is discarded on every container recreate without logging anything.
influxdb_container_root: /var/lib/influxdb3
# Must match the variable the deployed binary actually reads: the current image
# advertises `--data-dir <DIR> [env: INFLUXDB3_DATA_DIR=]`. Earlier revisions
# used INFLUXDB3_DB_DIR, which the image stopped honouring -- that silent change
# is what moved the store off the mount in 2026-07. The role prints this line
# from `influxdb3 serve --help` on every run, so check it when bumping the image.
influxdb_container_data_dir: "{{ influxdb_container_root }}/data"
# Database and retention window. InfluxDB 3 Core only honours
# `--retention-period` when the database is *created*; `influxdb3 update
# database` cannot change it afterwards (upstream docs). Expired data is
# dropped, so the retention window is also the disk bound. `none` keeps data
# forever.
influxdb_database_name: system-monitor
influxdb_retention_period: "90d"
influxdb_store_host_dir: "{{ docker_dir }}/{{ influxdb_container_name }}/db"
# Fail the play if the store does not live on the bind mount. The check looks
# for files created by the container inside the host directory after it starts.
influxdb_verify_persistence: true
# InfluxDB needs time to flush its WAL on SIGTERM; the Docker default (10s) can
# cut that short on a recreate or a host shutdown.
influxdb_stop_timeout: 30
influxdb_subdomain: influxdb
influxdb_ui_subdomain: influxdb-ui

# Port the InfluxDB 3 UI (influxdata/influxdb3-ui) listens on inside the container.
influxdb_ui_port: 8080
influxdb_dashboard_url: https://{{ influxdb_ui_subdomain }}.{{ host_local }}/
influxdb_dashboard_name: InfluxDB
influxdb_homer:
  name: "{{ influxdb_dashboard_name }}"
  category: system
