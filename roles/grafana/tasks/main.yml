---
- name: Create the Grafana data directory
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ grafana_container_name }}/{{ item }}"
    state: directory
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0755"
  loop:
    - data
    - provisioning/dashboards
    - provisioning/datasources

- name: Create the Grafana provisioning configuration for dashboards
  ansible.builtin.template:
    src: provisioning.dashboards.yml.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards/dashboards.yml"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for InfluxDB datasource
  when: "'influxdb' in containers"
  ansible.builtin.template:
    src: provisioning.datasources.influxdb.yml.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/datasources/influxdb.yml"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for Prometheus datasource
  when: "'prometheus' in containers"
  ansible.builtin.template:
    src: provisioning.datasources.prometheus.yml.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/datasources/prometheus.yml"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for vLLM dashboard
  when: "'vllm' in containers"
  ansible.builtin.template:
    src: provisioning.dashboards.vllm.json.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards/vllm.json"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for System Monitor dashboard
  when: "'influxdb' in containers"
  ansible.builtin.template:
    src: provisioning.dashboards.system.json.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards/system-monitor.json"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for Docker Containers dashboard
  when: "'influxdb' in containers"
  ansible.builtin.template:
    src: provisioning.dashboards.docker.json.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards/docker-containers.json"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Create the Grafana provisioning configuration for S.M.A.R.T. Disk Health dashboard
  when: "'influxdb' in containers"
  ansible.builtin.template:
    src: provisioning.dashboards.smart.json.j2
    dest: "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards/smart-disk-health.json"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0640"

- name: Make sure that Grafana container is created and running
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    image: grafana/grafana:latest
    pull: true
    user: "{{ guid }}"
    networks:
      - name: "{{ grafana_network_name }}"
    state: started
    env:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SERVER_ROOT_URL: "{{ grafana_dashboard_url }}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: "{{ grafana_system_dashboard_uid }}"
      INFLUXDB_TOKEN: "{{ influxdb_token }}"
    command: grafana-server --config /etc/grafana/grafana.ini cfg:default.feature_toggles.enable=newInfluxDSConfigPageDesign
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/datasources:/etc/grafana/provisioning/datasources:ro"
      - "{{ docker_dir }}/{{ grafana_container_name }}/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro"
      - "{{ docker_dir }}/{{ grafana_container_name }}/data:/var/lib/grafana"
    restart_policy: unless-stopped
    labels:
      swag.uptime-kuma.enabled: "true"
      swag.uptime-kuma.monitor.name: Grafana
      swag.uptime-kuma.monitor.url: "{{ grafana_dashboard_url }}"

- name: Install the SWAG config files
  template:
    src: "{{ grafana_container_name }}.subdomain.conf.j2"
    dest: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ grafana_container_name }}.subdomain.conf"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0644"
