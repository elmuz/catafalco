---
# 1. Solve DNS and routing for the internal network "https://influxdb.catafal.co" or change to "http://127.0.0.1:8086".
# 2. Ensure the token is valid
# 3. Ensure configuration file is chmod 644

# If using Mosquitto as MQTT broker, note that by default it only listens to localhost.
# You can change this by adding next two lines in `/etc/mosquitto/mosquitto.conf`:
#  ```
#  allow_anonymous true
#  listener 1883
#  ```

- name: Add InfluxDB repository key
  ansible.builtin.deb822_repository:
    name: influxdb
    enabled: true
    types: deb
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    signed_by: https://repos.influxdata.com/influxdata-archive.key
    mode: "0644"

- name: Update repositories cache and install telegraf package
  ansible.builtin.apt:
    name:
      - telegraf
      - nvme-cli  # for SMART
      - sysstat  # iostat
    state: latest
    update_cache: true

- name: Save telegraf path
  command: which telegraf
  register: telegraf_path

- name: Set cap_sys_rawio,cap_dac_read_search,cap_sys_admin+ep on {{ telegraf_path.stdout }}
  community.general.capabilities:
    path: "{{ telegraf_path.stdout }}"
    capability: cap_sys_rawio,cap_dac_read_search,cap_sys_admin+ep
    state: present

# The kernel device name (sda, nvme1n1, ...) is assigned by probe order and
# changes when disks are added, moved or the machine is rebooted. Serial
# numbers do not, so host_vars stores the serial as the disk's identity and
# everything else is looked up here at deploy time.
#
# Three things are derived: the /dev/disk/by-id path (stable across reboots,
# handed to smartctl), a *static label* (Data1, Parity1, Cache1, ...) that the
# regex processor writes into the `device` tag, and a static `serial_no` tag
# (processors.template) written on every poll of the disk. The label is
# semantic, so a reboot or a disk shuffle cannot retarget it; the serial stays
# the identity and is what every consumer joins on. The static serial tag is
# what keeps standby and failed polls attributable: smartctl emits no
# serial_no field for them, and the label may change in host_vars. Earlier
# revisions tagged samples with the kernel name resolved at deploy time, which
# went stale on the next boot.
# The by-id link is matched by serial only: rebuilding its name from
# model+serial broke whenever a firmware string changed.
- name: Build the list of monitored SMART disks
  ansible.builtin.set_fact:
    telegraf_smart_disks: >-
      {{ (data_disks | default([]))
         + (parity_disks | default([]))
         + (cache_disks | default([]))
         + (system_disks | default([])) }}

# data/parity/cache disks carry `label`, system disks carry `name`. Both are
# static and human-readable, so they are safe to publish as a tag. The tag is
# display-only: joins use serial_no (SMART) / ID_SERIAL_SHORT (diskio).
- name: Build the static label of every monitored disk
  ansible.builtin.set_fact:
    telegraf_disk_labels: >-
      {{ telegraf_disk_labels | default({})
         | combine({item.serial:
                    (item.label | default(item.name | default('disk-' ~ item.serial)))}) }}
  loop: "{{ telegraf_smart_disks }}"
  loop_control:
    label: "{{ item.serial }}"

- name: Validate that the monitored serials and effective labels are unique
  ansible.builtin.assert:
    that:
      - >-
        telegraf_smart_disks | map(attribute='serial') | list | length
        == telegraf_smart_disks | map(attribute='serial') | unique | list | length
      - >-
        telegraf_disk_labels.values() | list | length
        == telegraf_disk_labels.values() | list | unique | list | length
    fail_msg: >-
      The serial numbers in data_disks/parity_disks/cache_disks/system_disks
      must be unique (the serial is the disk identity), and the effective
      labels (`label`, or `name` for system disks) must be unique too: they
      are published as the `device` tag and drive the serial-tag processors.

- name: Locate the persistent by-id link of every monitored disk
  ansible.builtin.find:
    paths: /dev/disk/by-id
    patterns:
      - "ata-*_{{ item.serial }}"
      - "nvme-*_{{ item.serial }}"
    file_type: link
    recurse: false
  loop: "{{ telegraf_smart_disks }}"
  register: telegraf_smart_disk_links
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.serial }}"

- name: Validate that every monitored disk is present exactly once
  ansible.builtin.assert:
    that:
      - item.matched | int == 1
    fail_msg: >-
      {{ item.item.label | default(item.item.name) }} ({{ item.item.model }},
      serial {{ item.item.serial }}) matched {{ item.matched }} of the
      expected ata-*/nvme-* links in /dev/disk/by-id. Check that the disk is
      connected and that the serial in host_vars is correct.
  loop: "{{ telegraf_smart_disk_links.results }}"
  loop_control:
    label: "{{ item.item.serial }}"

- name: Map serial numbers to their by-id paths
  ansible.builtin.set_fact:
    telegraf_smart_id_paths: >-
      {{ telegraf_smart_id_paths | default({})
         | combine({item.item.serial: item.files[0].path}) }}
  loop: "{{ telegraf_smart_disk_links.results }}"
  loop_control:
    label: "{{ item.item.serial }}"

# Only used as a sanity check that the by-id link still points at a block
# device. The kernel name itself is NOT published any more: it is probe-order
# dependent, so it can only be trusted at runtime (lsblk, diskio.name).
- name: Resolve the block device behind each by-id link
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ telegraf_smart_id_paths[item.serial] }}"
  loop: "{{ telegraf_smart_disks }}"
  register: telegraf_smart_disk_targets
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.serial }}"

- name: Validate the resolved block devices
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | basename is match('^(sd[a-z]+|nvme[0-9]+n[0-9]+)$')
    fail_msg: >-
      Could not resolve the by-id link of {{ item.item.serial }} to a block
      device (got "{{ item.stdout }}"). Check the disk and the udev by-id rules.
  loop: "{{ telegraf_smart_disk_targets.results }}"
  loop_control:
    label: "{{ item.item.serial }}"

# The MCP host-service tools read `systemctl status` and `journalctl -u`.
# Without the systemd-journal group a non-root session only sees its own
# messages, so every host-service log request returns "No entries".
- name: Allow the admin user to read the system journal
  ansible.builtin.user:
    name: "{{ username }}"
    groups:
      - systemd-journal
    append: true

# nvidia_smi is the only GPU input. Telegraf refuses to start the whole
# agent (not just the input) when the configured executable is missing, so
# only render it when the binary is actually present. This keeps the NVIDIA
# drivers optional: uninstalling them must not take the monitoring stack down.
- name: Check whether nvidia-smi is available
  ansible.builtin.command:
    cmd: nvidia-smi --version
  register: telegraf_nvidia_smi_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record whether the nvidia_smi input can be enabled
  ansible.builtin.set_fact:
    telegraf_nvidia_smi_present: "{{ telegraf_nvidia_smi_check.rc == 0 }}"

- name: Template the main telegraf config
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: telegraf
    mode: "0644"

- name: Copy the main telegraf config (2)
  ansible.builtin.template:
    src: telegraf.j2
    dest: /etc/default/telegraf
    owner: root
    group: telegraf
    mode: "0644"

- name: Add telegraf user to the docker group
  ansible.builtin.user:
    name: telegraf
    groups:
      - docker
    append: true

# SMART is the only telegraf input that needs root. Grant only the two
# binaries used by [[inputs.smart]] instead of adding the service account to
# the sudo group, which would rely on a blanket passwordless rule.
- name: Allow telegraf to read SMART data without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telegraf-smart
    content: |
      # Managed by Ansible (telegraf role).
      # [[inputs.smart]] calls smartctl and nvme-cli with use_sudo = true.
      # Keep the grant scoped to those binaries; do not add telegraf to the
      # sudo group or restore a blanket passwordless-sudo rule.
      #
      # Suppress PAM session noise (six polls every five minutes) but keep
      # sudo's command logging in the journal for auditability.
      Defaults:telegraf !pam_session
      telegraf ALL=(root) NOPASSWD: /usr/sbin/smartctl, /usr/sbin/nvme
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Older revisions added telegraf to the sudo group. Remove only that
# membership and leave any other groups (e.g. docker) untouched.
- name: Remove telegraf from the sudo group
  ansible.builtin.command:
    argv:
      - gpasswd
      - --delete
      - telegraf
      - "{{ system_sudo_group | default('sudo') }}"
  register: telegraf_sudo_group_removal
  changed_when: telegraf_sudo_group_removal.rc == 0
  failed_when: telegraf_sudo_group_removal.rc not in [0, 3]  # 3 = not a member

- name: Restart telegraf unit
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    name: telegraf
