---
- name: Create the necessary Miniflux folder
  ansible.builtin.file:
    path: "{{ docker_dir }}/{{ miniflux_container_name }}"
    state: directory
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0750"

- name: Create docker network
  ansible.builtin.include_tasks:
    file: network.yml

- name: Make sure that Postgres container is created and running
  community.docker.docker_container:
    name: "{{ miniflux_container_name }}-db"
    image: postgres:18
    pull: true
    networks:
      - name: "{{ miniflux_network_name }}"
    state: started
    env:
      POSTGRES_USER: "{{ miniflux_db_user }}"
      POSTGRES_PASSWORD: "{{ miniflux_db_password }}"
      POSTGRES_DB: "{{ miniflux_db_name }}"
    volumes:
      - "{{ docker_dir }}/{{ miniflux_container_name }}/db:/var/lib/postgresql"
    restart_policy: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

- name: Make sure that Miniflux container is created and running
  community.docker.docker_container:
    name: "{{ miniflux_container_name }}"
    image: miniflux/miniflux:latest
    pull: true
    networks:
      - name: "{{ miniflux_network_name }}"
    state: started
    env:
      DATABASE_URL: "postgres://{{ miniflux_db_user }}:{{ miniflux_db_password }}@{{ miniflux_container_name }}-db/{{ miniflux_db_name }}?sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "{{ miniflux_admin_password }}"
    volumes:
      - "{{ docker_dir }}/{{ miniflux_container_name }}/db:/var/lib/postgresql"
    restart_policy: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

- name: Install the SWAG config files
  template:
    src: "{{ miniflux_container_name }}.subdomain.conf.j2"
    dest: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ miniflux_container_name }}.subdomain.conf"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0644"
