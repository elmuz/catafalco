---
- name: Create docker network
  ansible.builtin.include_tasks:
    file: network.yml

- name: Make sure Nebula Sync container is created and running
  community.docker.docker_container:
    name: "{{ nebula_sync_container_name }}"
    image: ghcr.io/lovelaze/nebula-sync:latest
    pull: true
    state: started
    networks:
      - name: "{{ nebula_sync_network_name }}"
    env:
      PRIMARY: "https://{{ dns[0] }}|{{ dns_api_key[0] }}"
      REPLICAS: "https://{{ dns[1] }}|{{ dns_api_key[1] }}"
      FULL_SYNC: "true"
      RUN_GRAVITY: "false"
      CRON: "15 * * * *"
      CLIENT_RETRY_DELAY_SECONDS: "3"
      CLIENT_TIMEOUT_SECONDS: "25"
      CLIENT_SKIP_TLS_VERIFICATION: "true"
      WEBHOOK_SYNC_SUCCESS_URL: "{{ healthchecks_dashboard_url }}/ping/0d58dcdf-020e-439a-a870-3cb917b4fb91"
      WEBHOOK_SYNC_FAILURE_URL: "{{ healthchecks_dashboard_url }}/ping/0d58dcdf-020e-439a-a870-3cb917b4fb91/fail"
      WEBHOOK_CLIENT_SKIP_TLS_VERIFICATION: "false"
      NS_DEBUG: "true"
      TZ: "{{ timezone }}"
    restart_policy: unless-stopped
