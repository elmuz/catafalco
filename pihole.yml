---
- name: Bootstrap (network, timezone, users, SSH)
  hosts: dns
  become: true
  become_user: root
  become_method: ansible.builtin.su

  tags:
    - bootstrap
    - never

  vars:
    ansible_become_password: "{{ root_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  tasks:
    - name: Get current status of time synchronization
      ansible.builtin.command: timedatectl show -P NTPSynchronized
      register: ntp_status
      changed_when: false

    - name: Install NTP/chrony
      when: ntp_status.stdout != "yes"
      ansible.builtin.systemd:
        name: systemd-timesyncd.service
        state: started
        enabled: true

    - name: Configure timezone
      community.general.timezone:
        name: "{{ timezone | default('UTC') }}"

    - name: Update and upgrade system packages
      ansible.builtin.package:
        name: "*"
        state: latest
        update_cache: true

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Update /etc/hosts with new hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    - name: Set static IP
      block:
        - name: Get active egress interface
          ansible.builtin.command: ip route get 1.1.1.1
          register: ip_route_out
          changed_when: false

        - name: Parse interface name from route output
          ansible.builtin.set_fact:
            discovered_interface: "{{ ip_route_out.stdout.split('dev')[1].split()[0] }}"
          when: "'dev' in ip_route_out.stdout"

        - name: Fail if interface not found
          ansible.builtin.fail:
            msg: "Could not determine active network interface."
          when: discovered_interface is not defined

        - name: Get IP address and prefix for {{ discovered_interface }}
          ansible.builtin.shell: |
            ip addr show dev {{ discovered_interface }} | awk '/inet / {print $2; exit}'
          register: ip_addr_out
          changed_when: false

        - name: Parse IP and prefix
          ansible.builtin.set_fact:
            discovered_ip_cidr: "{{ ip_addr_out.stdout.strip() }}"
          when: ip_addr_out.stdout | length > 0

        - name: Fail if IP not found
          ansible.builtin.fail:
            msg: "No IPv4 address found on interface {{ discovered_interface }}"
          when: discovered_ip_cidr is not defined or discovered_ip_cidr == ""

        - name: Get default gateway via {{ discovered_interface }}
          ansible.builtin.shell: |
            ip route show dev {{ discovered_interface }} |
            awk '/default via/ {print $3; exit}'
          register: gateway_out
          changed_when: false

        - name: Parse gateway
          ansible.builtin.set_fact:
            discovered_gateway: "{{ gateway_out.stdout.strip() }}"
          when: gateway_out.stdout | length > 0

        - name: Fail if gateway missing
          ansible.builtin.fail:
            msg: "No gateway found for interface {{ discovered_interface }} — not suitable for static config."
          when: discovered_gateway is not defined or discovered_gateway == ""

        - name: Create Netplan config with static IP and forced DNS
          ansible.builtin.copy:
            content: |
              # Static config for {{ discovered_interface }}
              network:
                version: 2
                renderer: networkd
                ethernets:
                  {{ discovered_interface }}:
                    match:
                      name: "{{ discovered_interface }}"
                    dhcp4: no
                    dhcp6: no
                    accept-ra: no
                    addresses:
                      - {{ discovered_ip_cidr }}
                    routes:
                      - to: default
                        via: {{ discovered_gateway }}
                    nameservers:
                      addresses: [9.9.9.9, 149.112.112.112]
                    ipv6-privacy: true
            dest: "/etc/netplan/05-static-{{ discovered_interface }}.yaml"
            owner: root
            group: root
            mode: "0600"

        - name: Apply netplan configuration
          ansible.builtin.command: /usr/sbin/netplan apply
          changed_when: true

    - name: Install main packages
      ansible.builtin.package:
        name:
          - sudo
          - vim
          - zsh
        state: present

    - name: Create main user
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ password | password_hash('sha512') }}"
        update_password: on_create
        groups: sudo
        append: true
        shell: /bin/zsh

    - name: Set authorized keys taken from path on controller node
      ansible.posix.authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('file', ssh_public_key_path) }}"

    - name: Verify SSH key access externally
      become: false
      ansible.builtin.command: >
        ssh -o StrictHostKeyChecking=no
        -o BatchMode=yes
        -o ConnectTimeout=5
        -i "{{ ansible_ssh_private_key_file }}"
        {{ username }}@{{ inventory_hostname }} exit
      delegate_to: localhost

    - name: Update /etc/ssh/sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?{{ item[0] }}'
        line: '{{ item[0] }} {{ item[1] }}'
        state: present
      loop:
        - ["PermitRootLogin", "no"]
        - ["PasswordAuthentication", "no"]
        - ["PubkeyAuthentication", "yes"]

    - name: Reload SSH service to apply changes
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

- name: Install Pi-hole
  hosts: dns
  become: true
  become_method: ansible.builtin.sudo

  gather_facts: false
  pre_tasks:
    - name: Gather facts as normal user
      setup:
      become: false
      tags: always

  roles:
    - zsh
    # - pihole

  tasks:
    - name: Install unattended upgrades
      ansible.builtin.package:
        name: unattended-upgrades
        state: present

    - name: Enable automatic security updates
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/02-armbian-periodic
        regexp: '^APT::Periodic::Enable'
        line: 'APT::Periodic::Enable "1";'
        state: present
        create: false

    - name: Enable periodic Pi-hole updates
      ansible.builtin.cron:
        name: "Pi-hole Update"
        minute: "0"
        hour: "4"
        weekday: "1"
        job: "/usr/local/bin/pihole -up 2>&1 | logger -t pihole-update"
